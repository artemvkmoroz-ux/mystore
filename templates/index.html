<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APK Store</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:linear-gradient(135deg,#1e1b4b,#0f172a);min-height:100vh;color:#e2e8f0;padding:30px 20px}
.w{max-width:1000px;margin:auto}
h1{text-align:center;font-size:2.2rem;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:25px}
form.up{background:rgba(30,41,59,.7);border:1px solid #334155;border-radius:14px;padding:20px;margin-bottom:30px}
input,textarea{width:100%;padding:11px;margin-bottom:10px;border-radius:9px;border:1px solid #334155;
background:#0f172a;color:#e2e8f0;font-size:15px;outline:none}
input:focus,textarea:focus{border-color:#22d3ee}
button{background:linear-gradient(90deg,#06b6d4,#8b5cf6);color:#fff;border:none;padding:11px 24px;
border-radius:9px;font-weight:600;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(139,92,246,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:rgba(30,41,59,.7);border:1px solid #334155;border-radius:14px;padding:18px;transition:.3s}
.card:hover{transform:translateY(-4px);border-color:#8b5cf6}
.card h3{color:#67e8f9;margin-bottom:6px}
.card p{color:#94a3b8;font-size:14px;margin-bottom:10px}
.m{display:flex;justify-content:space-between;font-size:12px;color:#64748b;margin-bottom:10px}
.a{display:flex;gap:8px}.a>*{flex:1}
.a button{width:100%;padding:8px;font-size:13px}
.del{background:linear-gradient(90deg,#ef4444,#dc2626)}
.flash{background:rgba(34,197,94,.2);border:1px solid #22c55e;color:#86efac;
padding:10px;border-radius:9px;margin-bottom:15px;text-align:center}
</style></head><body><div class="w">
<h1>📱 APK Store</h1>
{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}
<form class="up" action="/upload" method="post" enctype="multipart/form-data">
<input name="name" placeholder="Название" required>
<input name="ver" placeholder="Версия">
<textarea name="desc" placeholder="Описание" rows="2"></textarea>
<input type="file" name="apk" accept=".apk" required>
<button>⬆ Загрузить</button></form>
<div class="grid">
{% for a in apps %}
<div class="card"><h3>{{a.name}}</h3><p>{{a.desc or '—'}}</p>
<div class="m"><span>v{{a.ver}}</span><span>{{a.size}} MB</span><span>⬇ {{a.dl}}</span></div>
<div class="a">
<a href="/download/{{a.id}}"><button>Скачать</button></a>
<form action="/delete/{{a.id}}" method="post" onsubmit="return confirm('Удалить?')">
<button class="del">✕</button></form></div></div>
{% else %}<p style="grid-column:1/-1;text-align:center;color:#64748b">Пусто — загрузите APK</p>{% endfor %}
</div></div></body></html>
